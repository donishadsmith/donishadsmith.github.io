- title: Experience
  type: time_table
  contents:
    - title: Postdoctoral Researcher
      institution: Johns Hopkins University School of Medicine, Baltimore, Maryland
      year: 2025 - Present
      description:
        - "Advisor: Dr. Kristin Bigos"
        - Built the lab's PHI-compliant HPC infrastructure, replacing manual workflows with containerized (Apptainer), SLURM-orchestrated pipelines, allowing for batch-processing of terabytes of 3D/4D imaging data
        - Automated a standardization pipeline for two blinded, multi-session pharmacological studies, reconstructing acquisition metadata from NIfTI headers into a common BIDS schema and deterministically reconciling drug-to-session mappings
        - Engineered parallelized, end-to-end pipelines chaining GLM/gPPI modeling with configurable denoising, parametric and nonparametric group-level inference, and cluster identification, with automated HTML QC reports
        - Developed CLI and Streamlit web applications enabling non-technical lab staff to independently run multi-session data conversion, event-file generation, and clinical-score PDF extraction
        - Designed and deployed a containerized AFNI brain-atlas service (FastAPI, Podman) on Oracle Cloud with a Streamlit frontend for remote brain-region lookup by coordinate, removing the need for local neuroimaging software installations
    - title: Graduate Researcher
      institution: Florida International University, Miami, Florida
      year: 2019 - 2025
      description:
        - "Advisor: Dr. Angela Laird"
        - Developed and published a k-means clustering pipeline to characterize dynamic brain state transitions in longitudinal fMRI data, identifying distinct transition patterns across timepoints
        - Applied linear mixed-effects, structural equation models, and latent profile analyses to multi-session fMRI and behavioral data to identify dissociable brain-behavioral profiles, contributing to two peer-reviewed publications
        - Analyzed staff demographic data for the ABCD Study consortium, implementing hypothesis testing and data visualization to inform decisions for a multi-site research task force
        - Designed and delivered an R/Tidyverse workshop for 10+ graduate students through a DEI fellowship program, covering data analysis, manipulation, and visualization 
    - title: Graduate Researcher
    - title: Medical Laboratory Scientist I
      institution: Florida Department of Health, Miami, Florida
      year: 2019
      description:
        - Conducted confirmatory diagnostic testing for HIV and syphilis for public health surveillance programs

- title: Open-Source Projects
  type: time_table
  contents:
    - title: <a href="https://github.com/donishadsmith/bidsaid">BIDS-Aid</a>
      description:
        - Developed a Python package for post-hoc BIDS conversion of NIfTI datasets lacking source DICOMs, reconstructing JSON sidecars with acquisition metadata derived from image headers
        - Built configurable parsers for Presentation and E-Prime behavioral logs, automating timing and accuracy extraction for block and event-related fMRI designs into BIDS-compliant events files
        - Achieved a ~5x speedup in NIfTI compression by implementing a Rust extension (PyO3/maturin) for multithreaded compression, distributed as cross-platform abi3 wheels
        - Published to PyPI with release-triggered CI/CD and >90% coverage on Python 3.10–3.14 across Linux, macOS, and Windows
    - title: <a href="https://github.com/donishadsmith/neurocaps">NeuroCAPs</a>
      description:
        - Built a Python package for brain state classification using k-means, with multiprocessing for multi-subject timeseries extraction
        - Incorporated clustering validation (e.g., Davies-Bouldin, Silhouette), KNN-based spatial interpolation for parcellation coverage, temporal dynamics metrics (e.g., transition probabilities), and integrated visualizations (e.g., surface maps, network alignment)
        - Deployed via Docker with headless VTK rendering and CLI/Jupyter interfaces; published to PyPI through release-triggered CI/CD with >90% coverage across multiple OS platforms
    - title: <a href="https://github.com/donishadsmith/Engram">Engram</a>
      description:
        - Built a Game Boy Color emulator in Rust, with a CPU passing Blargg's test ROMs and a PPU rendering commercial CGB titles
        - Implemented APU and memory bank controllers (MBC1, MBC2, MBC3, MBC5, HuC1) with battery and real-time-clock saves 
    - title: <a href="https://github.com/donishadsmith/vswift">vswift</a>
      description:
        - Created an R package for ML model evaluation, implementing custom stratified sampling, cross-validation, and nested cross-validation for hyperparameter tuning, with parallel processing support at the fold-level
        - Designed a unified interface supporting classification algorithms (e.g., Regularized Logistic Regression, SVM, XGBoost, Neural Networks) while preserving algorithm-specific parameter tuning
        - Incorporated automated missing data imputation and multi-metric performance assessment (e.g., precision, recall, F1) with CLI output and visualizations, including ROC and Precision-Recall curves with AUC scores

